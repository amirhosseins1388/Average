<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>محاسبه میانگین نمرات</title>
<style>
    * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    direction: rtl;
}

.container {
    width: 100%;
    max-width: 500px;
}

.card {
    background: rgba(255, 255, 255, 0.95);
    padding: 35px;
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    text-align: center;
    animation: show 0.7s ease;
}

h1 {
    color: #222;
    margin-bottom: 10px;
    font-size: 28px;
}

.description {
    color: #777;
    margin-bottom: 30px;
    font-size: 14px;
}

.input-box {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

input {
    width: 100%;
    padding: 15px;
    border: 2px solid #ddd;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
    transition: 0.3s;
    direction: ltr;
}

input:focus {
    border-color: #667eea;
    box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(102, 126, 234, 0.35);
}

button:active {
    transform: scale(0.97);
}

#result {
    margin-top: 25px;
    padding: 15px;
    border-radius: 12px;
    background: #f3f4ff;
    color: #4f46e5;
    font-weight: bold;
    display: none;
    animation: resultShow 0.4s ease;
}

@keyframes show {
    from {
        opacity: 0;
        transform: translateY(30px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes resultShow {
    from {
        opacity: 0;
        transform: scale(0.9);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

@media (max-width: 500px) {
    body {
        padding: 15px;
    }

    .card {
        padding: 25px 20px;
    }

    h1 {
        font-size: 24px;
    }

    input,
    button {
        padding: 14px;
    }
}
</style>
    
</head>

<body>

    <main class="container">

        <div class="card">

            <h1>محاسبه میانگین نمرات</h1>

            <p class="description">
                نمرات خود را با کاما از یکدیگر جدا کنید
            </p>

            <form id="form">

                <div class="input-box">

                    <input
                        type="text"
                        id="input"
                        placeholder="مثال: 18, 17.5, 20, 19"
                        autocomplete="off"
                    >

                    <button id="button" type="submit">
                        محاسبه میانگین
                    </button>

                </div>

            </form>

            <div id="result"></div>

        </div>

    </main>

    <script src="./script.js"></script>

</body>
</html>
